name: Enrichment tests

on:
  push:
    paths:
      - 'services/enrichment/**'
      - 'db/init.sql'
      - '.github/workflows/enrichment-tests.yml'
  pull_request:
    paths:
      - 'services/enrichment/**'
      - 'db/init.sql'
      - '.github/workflows/enrichment-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Throwaway PostgreSQL 16, same as the log-parser workflow.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: honeypot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d honeypot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: services/enrichment

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python (same version as the Dockerfile)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/enrichment/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run all tests, including the database tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: ci_test
          PGPASSWORD: ci_test_password
          PGDATABASE: honeypot_test
          # Fail instead of skipping if the settings above ever go missing.
          REQUIRE_DB_TESTS: '1'
        run: python -m pytest -v
