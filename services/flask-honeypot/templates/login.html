<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northstar Systems — Employee Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="mark">NS</div>
        <div>
          <p class="kicker">Northstar Systems</p>
          <h1>Employee Access Portal</h1>
        </div>
      </header>

      <section class="card">
        <p class="lede">Sign in with your corporate directory account.</p>

        {% if error %}
        <p class="banner" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="/login" autocomplete="off">
          <label>
            Username
            <input type="text" name="username" required autofocus />
          </label>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
          <button type="submit">Sign in</button>
        </form>

        <p class="switch">
          New contractor?
          <a href="/signup">Create an account</a>
        </p>
        <p class="hint">Authorized personnel only. Sessions are monitored.</p>
      </section>
    </main>
  </body>
</html>
