<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northstar Systems — Request Access</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="mark">NS</div>
        <div>
          <p class="kicker">Northstar Systems</p>
          <h1>Request Employee Access</h1>
        </div>
      </header>

      <section class="card">
        <p class="lede">Register for directory credentials. Approval is required.</p>

        {% if notice %}
        <p class="banner banner-ok" role="status">{{ notice }}</p>
        {% endif %}
        {% if error %}
        <p class="banner" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="/signup" autocomplete="off">
          <label>
            Work email
            <input type="email" name="email" required autofocus />
          </label>
          <label>
            Username
            <input type="text" name="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
          <button type="submit">Create account</button>
        </form>

        <p class="switch">
          Already have access?
          <a href="/">Sign in</a>
        </p>
      </section>
    </main>
  </body>
</html>
