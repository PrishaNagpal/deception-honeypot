apiVersion: 1

datasources:
  - name: Honeypot DB
    uid: honeypot-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: hp-db:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
