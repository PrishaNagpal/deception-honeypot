# Track A lab — isolated decoy services.
# Ports are bound to 127.0.0.1 so this is not reachable on campus Wi-Fi.

name: deception-honeypot

services:
  flask-honeypot:
    build:
      context: ./services/flask-honeypot
    container_name: hp-flask
    restart: unless-stopped
    environment:
      PORT: "8080"
      LOG_PATH: /var/log/honeypot/http.json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/flask:/var/log/honeypot
    networks:
      honeypot_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  cowrie:
    image: cowrie/cowrie:latest
    container_name: hp-cowrie
    restart: unless-stopped
    environment:
      COWRIE_HONEYPOT_HOSTNAME: jumpbox-01
      COWRIE_HONEYPOT_SENSOR: northstar-ssh
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      # Linux named volume — Windows bind mounts deny Cowrie's log user.
      - cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
    networks:
      honeypot_net:
        ipv4_address: 172.28.0.11

  dionaea:
    build: ./services/dionaea
    container_name: hp-dionaea
    restart: unless-stopped
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:1445:445"
    volumes:
      - dionaea_lib:/opt/dionaea/var/lib
      - dionaea_logs:/opt/dionaea/var/log/dionaea
    networks:
      honeypot_net:
        ipv4_address: 172.28.0.12

  postgres:
    image: postgres:16-bookworm
    container_name: hp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-honeypot}
      # Used by db/zz-grafana-user.sh to create the read-only grafana_ro user.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once, only when pg_data is empty (first start).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # "zz-" so it runs after init.sql (tables must exist first).
      - ./db/zz-grafana-user.sh:/docker-entrypoint-initdb.d/zz-grafana-user.sh:ro
    networks:
      honeypot_net:
        ipv4_address: 172.28.0.13
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  log-parser:
    build: ./services/log-parser
    container_name: hp-parser
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: hp-db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-honeypot}
      FLASK_LOG: /logs/flask/http.json
      COWRIE_LOG: /logs/cowrie/cowrie.json
      DIONAEA_LOG: /logs/dionaea/dionaea.json
      DIONAEA_BINARIES_DIR: /logs/dionaea-lib/dionaea/binaries
      DIONAEA_UPLOADS_DIR: /logs/dionaea-lib/dionaea/ftp/root
    # No ports. Every log is mounted read-only: the parser can read the
    # honeypots' files but never change them.
    volumes:
      - ./data/flask:/logs/flask:ro
      - cowrie_logs:/logs/cowrie:ro
      - dionaea_logs:/logs/dionaea:ro
      - dionaea_lib:/logs/dionaea-lib:ro
    networks:
      honeypot_net:
        ipv4_address: 172.28.0.14

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: hp-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Read by grafana/provisioning/datasources/postgres.yml
      POSTGRES_DB: ${POSTGRES_DB:-honeypot}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Own volume: dashboards/settings survive restarts and reset-demo.sh.
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      honeypot_net:
        ipv4_address: 172.28.0.15

  enrichment:
    build: ./services/enrichment
    container_name: hp-enrich
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: hp-db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-honeypot}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    # No ports. Only talks to hp-db and the two enrichment APIs.
    networks:
      honeypot_net:
        ipv4_address: 172.28.0.16

volumes:
  cowrie_logs:
  dionaea_lib:
  dionaea_logs:
  pg_data:
  grafana_data:

networks:
  honeypot_net:
    name: honeypot_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
